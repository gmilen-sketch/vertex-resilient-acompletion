name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Dependencies
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements.txt
      - name: Build & Test
        run: python3 -m py_compile vertex_resilient_acompletion.py tests/test_unit_resilient_client.py tests/test_live_vertex_e2e.py && python3 tests/test_unit_resilient_client.py && python3 vertex_resilient_acompletion.py
